name: iosApp
options:
  bundleIdPrefix: com.gmoqa
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # Assets del dominio (catálogos + config de consolas, y el seed) como referencias de carpeta:
      # conservan la estructura en el bundle (catalogs/…, seed/…), que es lo que lee readTextAsset.
      # Viven en `data/` en la raíz, compartidos con Android, que los toma vía sourceSets.
      - path: ../data/catalogs
        type: folder
        buildPhase: resources
      - path: ../data/seed
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmoqa.fullset
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # App Group compartido con la Share Extension (canal para la foto compartida).
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # El framework Kotlin lo compila/copia el script de pre-build (embedAndSign) por config/SDK.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # Estáticas de whisper.cpp (transcripción), por plataforma.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/whisper/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
          # El framework es estático: la app linkea SQLite del sistema (lo usa el driver nativo de
          # SQLDelight/sqliter).
          - -lsqlite3
          # whisper.cpp + ggml (transcripción de notas de voz) y su runtime C++.
          - -lwhisper_all
          - -lc++
        # Necesario para que el script de pre-build pueda ejecutar Gradle (escribe fuera del sandbox).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: ShareExtension
    preBuildScripts:
      - name: Build whisper.cpp static libs
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/whisper/build-whisper.sh"
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # Recibe fotos del menú Compartir del sistema. Corre en su propio proceso; pasa la foto a la app
  # por el App Group group.com.gmoqa.fullset (ver ShareViewController.swift).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmoqa.fullset.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
